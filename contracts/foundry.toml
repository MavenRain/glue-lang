[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = []
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
# Paris has no PUSH0, so the bytecode runs on any EVM chain.
evm_version = "paris"
fs_permissions = [{ access = "read", path = "./test/fixtures" }]
# The generated verifiers read their arguments in assembly, by calldata
# offset, so solc reports their named parameters as unused.
ignored_warnings_from = ["src/verifiers"]
